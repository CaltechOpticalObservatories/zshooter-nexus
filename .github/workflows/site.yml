name: Build and deploy portal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect D2 changes
        id: detect_d2
        run: >
          bash tools/detect_d2_changes.sh
          "${{ github.event_name }}"
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test site tooling
        run: python -m unittest discover -s tests

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Install D2
        if: steps.detect_d2.outputs.render == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --method standalone --version "$(cat .d2-version)" --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Test shared diagram model
        if: steps.detect_d2.outputs.render == 'true'
        run: python -m unittest discover -s zshooter-arch/tests

      - name: Stage Site
        run: python tools/stage_site.py

      - name: Render D2
        if: steps.detect_d2.outputs.render == 'true'
        run: bash tools/render_d2.sh

      - name: Log D2 SVG drift
        if: steps.detect_d2.outputs.render == 'true'
        run: bash tools/log_d2_drift.sh

      - name: Sync D2 SVGs
        run: |
          bash tools/sync_d2_svgs.sh
          python tools/generate_diagram_manifest.py

      - name: Build Sphinx
        run: sphinx-build -b html docs docs/_build/html

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
