<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawing Viewer</title>
  <style>
    :root {
      --panel-bg: #ffffff;
      --panel-border: rgba(100, 116, 139, 0.35);
      --muted: #475569;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel-bg);
      flex-wrap: wrap;
    }
    .toolbar label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
    }
    .toolbar select {
      min-width: 18rem;
      max-width: 100%;
      padding: 0.4rem 0.55rem;
      border-radius: 8px;
      border: 1px solid rgba(100, 116, 139, 0.5);
      background: #fff;
    }
    .spacer {
      flex: 1 1 auto;
    }
    .toolbar a {
      font-size: 0.84rem;
      text-decoration: none;
    }
    #viewer-frame {
      border: 0;
      width: 100%;
      flex: 1 1 auto;
      min-height: 320px;
      background: white;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="selector">Drawing</label>
    <select id="selector"></select>
    <div class="spacer"></div>
    <a id="open-link" href="#" target="_blank" rel="noopener">Open raw file</a>
  </div>
  <iframe id="viewer-frame" title="Drawing viewer"></iframe>

  <script>
    const selector = document.getElementById("selector");
    const openLink = document.getElementById("open-link");
    const viewerFrame = document.getElementById("viewer-frame");
    const params = new URLSearchParams(window.location.search);
    const defaultCadRoot = "https://meridian.caltech.edu/";
    const drawingExtensions = new Set([".pdf"]);
    const largeFileThreshold = 50_000_000;
    let activeObjectUrl = null;

    function resolveUrl(value) {
      return new URL(value, window.location.href).toString();
    }

    function isCrossOrigin(url) {
      return new URL(url, window.location.href).origin !== window.location.origin;
    }

    function releaseObjectUrl() {
      if (activeObjectUrl) {
        URL.revokeObjectURL(activeObjectUrl);
        activeObjectUrl = null;
      }
    }

    function setUnavailable(message) {
      selector.innerHTML = "";
      selector.disabled = true;
      openLink.removeAttribute("href");
      releaseObjectUrl();
      viewerFrame.removeAttribute("src");
      viewerFrame.replaceWith(Object.assign(document.createElement("div"), {
        id: "viewer-frame",
        textContent: message
      }));
      const replacement = document.getElementById("viewer-frame");
      replacement.style.padding = "1rem";
      replacement.style.color = "#475569";
      replacement.style.flex = "1 1 auto";
      replacement.style.minHeight = "320px";
      replacement.style.background = "white";
    }

    function chooseInitial(entries) {
      const requested = params.get("selected") || params.get("pdf");
      if (!requested) return entries[0];
      return entries.find(entry =>
        entry.file === requested ||
        entry.path === requested ||
        entry.file.endsWith(requested) ||
        entry.title === requested
      ) || entries[0];
    }

    function naturalCompare(left, right) {
      return left.localeCompare(right, undefined, { numeric: true, sensitivity: "base" });
    }

    function filenameFromPath(path) {
      return decodeURIComponent(path.split("/").pop() || path);
    }

    function directoryListingSize(link) {
      const listingText = link.nextSibling?.textContent?.trim() || "";
      const match = listingText.match(/(\d+)\s*$/);
      return match ? Number(match[1]) : null;
    }

    function optionText(entry) {
      const label = entry.title || filenameFromPath(entry.path || entry.file);
      if (Number.isFinite(entry.sizeBytes) && entry.sizeBytes >= largeFileThreshold) {
        return `${label} (${Math.round(entry.sizeBytes / 1_000_000)} MB)`;
      }
      return label;
    }

    function getExtension(url) {
      const pathname = new URL(url, window.location.href).pathname;
      const dotIndex = pathname.lastIndexOf(".");
      return dotIndex >= 0 ? pathname.slice(dotIndex).toLowerCase() : "";
    }

    function normalizeDirectoryUrl(url) {
      const parsed = new URL(url, window.location.href);
      if (!parsed.pathname.endsWith("/")) {
        parsed.pathname += "/";
      }
      return parsed.toString();
    }

    function relativeCadPath(fileUrl, rootUrl) {
      const file = new URL(fileUrl);
      const root = new URL(rootUrl);
      const rootPath = root.pathname.endsWith("/") ? root.pathname : root.pathname + "/";
      let rel = file.pathname.startsWith(rootPath) ? file.pathname.slice(rootPath.length) : file.pathname.replace(/^\/+/, "");
      return decodeURIComponent(rel);
    }

    function fetchErrorDetail(error) {
      return error ? [error.name, error.message].filter(Boolean).join(": ") : "";
    }

    function describeDirectoryFetchFailure(directoryUrl, error) {
      const parsed = new URL(directoryUrl, window.location.href);
      const detail = fetchErrorDetail(error);
      const suffix = detail ? " Browser detail: " + detail + "." : "";

      if (window.location.protocol === "https:" && parsed.protocol === "http:") {
        return (
          "Could not read CAD server listing: " + directoryUrl +
          ". This page is loaded over HTTPS, so the browser blocks insecure HTTP CAD requests as mixed content." +
          " Use an HTTPS CAD URL instead." + suffix
        );
      }

      return (
        "Could not read CAD server listing: " + directoryUrl +
        ". The browser blocked the request before JavaScript could read the response." +
        " Check the browser Console or Network panel for the exact reason." +
        " If it reports Access-Control-Allow-Origin, the CAD server must allow this site origin." + suffix
      );
    }

    async function readDirectoryLinks(directoryUrl) {
      let response;
      try {
        response = await fetch(directoryUrl, { cache: "no-store" });
      } catch (error) {
        throw new Error(describeDirectoryFetchFailure(directoryUrl, error));
      }
      if (!response.ok) {
        throw new Error(
          "Could not read CAD server listing: " + directoryUrl +
          ". HTTP status: " + response.status + " " + response.statusText + "."
        );
      }
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      return Array.from(doc.querySelectorAll("a[href]")).map(link => ({
        href: link.getAttribute("href"),
        sizeBytes: directoryListingSize(link)
      }));
    }

    async function readCadManifest() {
      try {
        const response = await fetch(resolveUrl("../cad_manifest.json"), { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const manifest = await response.json();
        if (!Array.isArray(manifest)) throw new Error("manifest is not an array");
        return manifest.filter(entry => entry && typeof entry.file === "string");
      } catch (error) {
        console.warn("Could not read CAD manifest; using directory order.", error);
        return [];
      }
    }

    function applyCadManifest(entries, manifest) {
      const remaining = new Map(entries.map(entry => [entry.path, entry]));
      const prioritized = [];

      for (const item of manifest) {
        const entry = remaining.get(item.file);
        if (!entry) continue;
        prioritized.push({
          ...entry,
          title: typeof item.label === "string" && item.label.trim()
            ? item.label.trim()
            : filenameFromPath(entry.path)
        });
        remaining.delete(item.file);
      }

      return prioritized.concat(entries.filter(entry => remaining.has(entry.path)));
    }

    async function discoverCadEntries(cadRoot, extensions) {
      const rootUrl = normalizeDirectoryUrl(cadRoot || defaultCadRoot);
      const pending = [rootUrl];
      const visited = new Set();
      const found = new Map();

      while (pending.length > 0) {
        const current = pending.pop();
        if (visited.has(current)) continue;
        visited.add(current);

        const links = await readDirectoryLinks(current);
        for (const link of links) {
          const href = link.href;
          if (!href) continue;
          const cleanHref = href.split("?", 1)[0].split("#", 1)[0];
          if (!cleanHref || cleanHref === "../" || cleanHref === "./") continue;

          const candidate = new URL(cleanHref, current);
          if (!candidate.href.startsWith(rootUrl)) continue;

          const path = relativeCadPath(candidate.href, rootUrl);
          if (!path) continue;

          if (cleanHref.endsWith("/") || candidate.pathname.endsWith("/")) {
            pending.push(candidate.toString());
            continue;
          }

          if (extensions.has(getExtension(candidate.href))) {
            found.set(path, {
              title: filenameFromPath(path),
              file: candidate.toString(),
              path,
              sizeBytes: link.sizeBytes
            });
          }
        }
      }

      return Array.from(found.values()).sort((left, right) => naturalCompare(left.title, right.title));
    }

    async function resolveViewerPdfUrl(pdfUrl) {
      if (!isCrossOrigin(pdfUrl)) {
        return pdfUrl;
      }

      const response = await fetch(pdfUrl);
      if (!response.ok) {
        throw new Error("Could not load remote drawing: " + pdfUrl);
      }

      releaseObjectUrl();
      activeObjectUrl = URL.createObjectURL(await response.blob());
      return activeObjectUrl;
    }

    async function update(entries, selectedFile) {
      const entry = entries.find(item => item.file === selectedFile) || entries[0];
      if (!entry) return;

      const pdfUrl = resolveUrl(entry.file);
      releaseObjectUrl();
      const viewerPdfUrl = await resolveViewerPdfUrl(pdfUrl);
      const viewerUrl = 'pdfjs/web/viewer.html?file=' + encodeURIComponent(viewerPdfUrl);

      openLink.href = pdfUrl;
      viewerFrame.src = viewerUrl;
    }

    async function main() {
      const cadRoot = params.get("cadRoot") || defaultCadRoot;
      const directPdf = params.get("pdf");

      let entries;
      if (directPdf) {
        entries = [{ title: "Selected drawing", file: directPdf }];
      } else {
        const [discovered, manifest] = await Promise.all([
          discoverCadEntries(cadRoot, drawingExtensions),
          readCadManifest()
        ]);
        entries = applyCadManifest(discovered, manifest);
      }

      if (!Array.isArray(entries) || entries.length === 0) {
        setUnavailable("No CAD drawings available.");
        return;
      }

      selector.innerHTML = "";
      for (const entry of entries) {
        const option = document.createElement("option");
        option.value = entry.file;
        option.textContent = optionText(entry);
        selector.appendChild(option);
      }

      const initial = chooseInitial(entries);
      selector.value = initial.file;
      selector.addEventListener("change", async () => {
        try {
          await update(entries, selector.value);
        } catch (error) {
          console.error(error);
          document.body.innerHTML = '<p style="padding:1rem;color:#b91c1c">' + (error.message || 'Could not load the selected drawing.') + '</p>';
        }
      });
      await update(entries, initial.file);
    }

    main().catch(error => {
      console.error(error);
      document.body.innerHTML = '<p style="padding:1rem;color:#b91c1c">' + (error.message || 'Could not initialize drawing viewer.') + '</p>';
    });
  </script>
</body>
</html>
